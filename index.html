<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Fusey | Наклейки для электрощита</title>
  <meta name="description" content="Fusey: создание наклеек для электрических щитов с точными размерами, линиями реза и экспортом в PDF.">
  <meta name="theme-color" content="#0E0F10">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/PTSans-Bold.ttf" as="fetch" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="is-loading" data-left-tab="library" data-mview="library">
  <a class="skip-link" href="#canvasScroll">Перейти к листу</a>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <!-- Bolt and wordmark share one "current" sweep: CSS only, so it runs the same in
             Safari, which ignores CSS filters on SVG children and pauses SMIL unreliably. -->
        <span class="brand__mark" aria-hidden="true"><span class="brand__glow"></span><span class="brand__bolt"></span></span>
        <span class="brand__name">Fusey</span>
      </div>

      <div class="project-name">
        <label class="sr-only" for="projectName">Название проекта</label>
        <input id="projectName" class="project-name__input" type="text" maxlength="120" autocomplete="off" spellcheck="false" data-project-name>
      </div>

      <div class="topbar-stats" aria-live="polite">
        <span class="stat"><b id="statStickers">0</b> <span id="statStickersLabel">наклеек</span></span>
        <span class="stat"><b id="statPages">0</b> <span id="statPagesLabel">листов</span></span>
        <span class="stat stat--error" id="statErrors" hidden>
          <svg class="ui-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 21.5 20H2.5ZM12 10v4.5M12 17.2h.01"/></svg>
          Ошибки раскладки
        </span>
      </div>

      <div class="topbar-actions">
        <button id="undoBtn" class="icon-btn" aria-label="Отменить (Ctrl+Z)" title="Отменить (Ctrl+Z)">
          <svg class="ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button id="redoBtn" class="icon-btn" aria-label="Повторить (Ctrl+Shift+Z)" title="Повторить (Ctrl+Shift+Z)">
          <svg class="ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        </button>
        <div class="menu-wrap">
          <button id="menuBtn" class="icon-btn" aria-label="Меню проекта" aria-haspopup="true" aria-expanded="false" aria-controls="projectMenu" title="Проект">
            <svg class="ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 5.5h.01M12 12h.01M12 18.5h.01"/></svg>
          </button>
          <div id="projectMenu" class="menu" role="menu" hidden>
            <!-- Phones have no room for the name in the top bar, so it lives here. -->
            <div class="menu__field only-mobile" role="none">
              <label class="field-label" for="menuProjectName">Название проекта</label>
              <input id="menuProjectName" class="input" type="text" maxlength="120" autocomplete="off" spellcheck="false" data-project-name>
            </div>
            <div class="menu__sep only-mobile" role="separator"></div>
            <button role="menuitem" data-menu="new">Новый проект</button>
            <button role="menuitem" data-menu="import-json">Открыть из JSON…</button>
            <button role="menuitem" data-menu="export-json">Сохранить в JSON</button>
            <div class="menu__sep" role="separator"></div>
            <button role="menuitem" class="menu__danger" data-menu="reset">Сбросить все данные…</button>
          </div>
        </div>
        <button class="btn btn--primary topbar-export" data-action="export">
          <svg class="ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
          <span class="topbar-export__label">Экспорт PDF</span>
        </button>
      </div>
    </header>

    <aside class="sidebar" aria-label="Шаблоны, наклейки и настройки листа">
      <div class="tabs" id="tabs" role="tablist" aria-label="Разделы">
        <span class="tabs__ink" id="tabsInk" aria-hidden="true"></span>
        <button role="tab" class="tab" data-tab="library" id="tab-library" aria-controls="panel-library">Шаблоны</button>
        <button role="tab" class="tab" data-tab="stickers" id="tab-stickers" aria-controls="panel-stickers">Наклейки <span class="tab__count" id="stickersTabCount"></span></button>
        <button role="tab" class="tab" data-tab="sheet" id="tab-sheet" aria-controls="panel-sheet">Лист</button>
      </div>
      <section class="panel" id="panel-library" role="tabpanel" aria-labelledby="tab-library"></section>
      <section class="panel" id="panel-stickers" role="tabpanel" aria-labelledby="tab-stickers"></section>
      <section class="panel" id="panel-sheet" role="tabpanel" aria-labelledby="tab-sheet"></section>
    </aside>

    <main class="workspace" id="workspace" aria-label="Предпросмотр листа">
      <div class="canvas-toolbar">
        <div class="segmented segmented--compact" role="radiogroup" aria-label="Режим просмотра">
          <button type="button" role="radio" class="segmented__btn" data-view="design" aria-checked="true">Дизайн</button>
          <button type="button" role="radio" class="segmented__btn" data-view="print" aria-checked="false">Печать</button>
        </div>
        <div class="pager" role="group" aria-label="Страницы">
          <button id="pagePrev" class="icon-btn icon-btn--sm" aria-label="Предыдущий лист">
            <svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <span class="pager__label" id="pageLabel" aria-live="polite">1 / 1</span>
          <button id="pageNext" class="icon-btn icon-btn--sm" aria-label="Следующий лист">
            <svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
        <span class="canvas-info" id="sheetInfo"></span>
        <div class="zoom" role="group" aria-label="Масштаб">
          <button id="zoomOut" class="icon-btn icon-btn--sm" aria-label="Уменьшить масштаб">
            <svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
          <button id="zoomLabel" class="zoom__label" title="Показать в натуральную величину (100%)" aria-label="Масштаб. Нажмите для натуральной величины">100%</button>
          <button id="zoomIn" class="icon-btn icon-btn--sm" aria-label="Увеличить масштаб">
            <svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button id="zoomFit" class="btn btn--ghost btn--sm" aria-pressed="true">Вписать</button>
        </div>
      </div>
      <div class="canvas-alerts" id="canvasAlerts" hidden></div>
      <div class="canvas-scroll" id="canvasScroll" tabindex="-1">
        <div class="sheet-stage" id="sheetStage"></div>
        <div class="canvas-empty" id="canvasEmpty" hidden></div>
      </div>
    </main>

    <aside class="inspector" id="inspector" aria-labelledby="inspectorTitle">
      <div class="inspector__head">
        <span class="sheet-handle" aria-hidden="true"></span>
        <h2 class="inspector__title" id="inspectorTitle">Редактор</h2>
        <button id="inspectorClose" class="btn btn--ghost btn--sm inspector__close">Готово</button>
      </div>
      <div class="inspector__body" id="inspector-body"></div>
    </aside>
    <div class="sheet-scrim" id="sheetScrim" aria-hidden="true"></div>

    <nav class="mobile-nav" aria-label="Шаги">
      <span class="mobile-nav__ink" id="navInk" aria-hidden="true"></span>
      <button class="mobile-nav__btn" data-mview-btn="library">
        <svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>
        <span>Шаблоны</span>
      </button>
      <button class="mobile-nav__btn" data-mview-btn="stickers">
        <svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
        <span>Наклейки</span>
      </button>
      <button class="mobile-nav__export" data-action="export" aria-label="Экспорт PDF">
        <svg class="ui-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        <span class="mobile-nav__export-label">PDF</span>
      </button>
      <button class="mobile-nav__btn" data-mview-btn="sheet">
        <svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18H6zM9 7h6M9 11h6M9 15h3"/></svg>
        <span>Лист</span>
      </button>
      <button class="mobile-nav__btn" data-mview-btn="preview">
        <svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12ZM12 14.8a2.8 2.8 0 1 0 0-5.6 2.8 2.8 0 0 0 0 5.6Z"/></svg>
        <span>Превью</span>
      </button>
    </nav>
  </div>

  <div class="app-loading" id="appLoading" role="status" aria-live="polite">
    <div class="skeleton skeleton--bar"></div>
    <div class="skeleton-layout">
      <div class="skeleton skeleton--side"></div>
      <div class="skeleton skeleton--sheet"></div>
      <div class="skeleton skeleton--side"></div>
    </div>
    <span class="sr-only">Загрузка Fusey…</span>
  </div>

  <dialog class="dialog" id="exportDialog" aria-labelledby="exportTitle">
    <form method="dialog" class="dialog__inner" onsubmit="return false">
      <header class="dialog__head">
        <h2 id="exportTitle">Экспорт PDF</h2>
        <button type="button" class="icon-btn" aria-label="Закрыть" onclick="this.closest('dialog').close()">
          <svg class="ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="dialog__body">
        <div id="exportBody"></div>
        <div class="field">
          <label class="field-label" for="exportName">Имя файла</label>
          <input id="exportName" class="input" type="text" autocomplete="off" spellcheck="false">
        </div>
        <div id="exportStatus"></div>
      </div>
      <footer class="dialog__foot">
        <button type="button" class="btn btn--ghost" id="exportCancel" onclick="this.closest('dialog').close()">Отмена</button>
        <button type="button" class="btn btn--primary" id="exportGo">
          <span class="btn__spinner" aria-hidden="true"></span>
          <svg class="ui-icon btn__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
          <span class="btn__label">Скачать PDF</span>
        </button>
      </footer>
    </form>
  </dialog>

  <dialog class="dialog dialog--sm" id="confirmDialog" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
    <form method="dialog" class="dialog__inner">
      <div class="dialog__body">
        <h2 id="confirmTitle"></h2>
        <p id="confirmMessage" class="dialog__text"></p>
      </div>
      <footer class="dialog__foot">
        <button class="btn btn--ghost" value="cancel" id="confirmCancel">Отмена</button>
        <button class="btn btn--primary" value="ok" id="confirmOk">Подтвердить</button>
      </footer>
    </form>
  </dialog>

  <dialog class="dialog dialog--sm" id="promptDialog" aria-labelledby="promptTitle">
    <form method="dialog" class="dialog__inner">
      <div class="dialog__body">
        <h2 id="promptTitle"></h2>
        <div class="field">
          <label class="field-label" for="promptInput" id="promptLabel"></label>
          <input id="promptInput" class="input" type="text" maxlength="80" autocomplete="off">
        </div>
      </div>
      <footer class="dialog__foot">
        <button class="btn btn--ghost" value="cancel">Отмена</button>
        <button class="btn btn--primary" value="ok" id="promptOk">Сохранить</button>
      </footer>
    </form>
  </dialog>

  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <input type="file" id="iconFile" accept=".svg,image/svg+xml" hidden>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <noscript><p class="noscript">Для работы Fusey нужен JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
